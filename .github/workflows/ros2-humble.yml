name: ROS 2 Humble
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS and test dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pytest python3-numpy python3-opencv python3-yaml ros-humble-cv-bridge ros-humble-message-filters ros-humble-realsense2-camera
      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --event-handlers console_direct+
      - name: Test geometry, dataset paths and ROS integration
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
