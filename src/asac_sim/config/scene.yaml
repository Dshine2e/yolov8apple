# Units: m, degrees only for FOV. Simulation installation, never real calibration.
world_frame: asac_sim_world
robot_position: [0.0, 0.0, 0.0]
joint_positions: {joint1: 0.0, joint2: 0.0, joint3: 0.0, joint4: 0.0, joint5: 0.0, joint6: 0.0, joint7: 0.02, joint8: 0.02}
rate_hz: 10.0
camera:
  camera_id: sim_top
  link_frame: asac_sim_camera_link
  optical_frame: asac_sim_camera_optical_frame
  position: [0.40, 0.0, 0.85]
  optical_quaternion_xyzw: [1.0, 0.0, 0.0, 0.0]  # optical +Z points down
  width: 640
  height: 480
  vertical_fov_deg: 50.0
  near_m: 0.05
  far_m: 3.0
table: {position: [0.30, 0.0, -0.04], size: [0.95, 0.70, 0.08]}
tray: {position: [0.42, 0.0, 0.012], size: [0.43, 0.35, 0.018]}
light: {direction: [-1, -1, 3], ambient: 0.5, diffuse: 0.6, specular: 0.25}
apples:
  - {name: red_apple, shape: apple, position: [0.32, -0.09, 0.064], radius_m: 0.045, color: [0.85, 0.045, 0.025, 1.0]}
  - {name: green_apple, shape: apple, position: [0.48, 0.07, 0.059], radius_m: 0.040, color: [0.52, 0.68, 0.08, 1.0]}
  - {name: golden_apple, shape: apple, position: [0.52, -0.10, 0.071], radius_m: 0.052, color: [0.85, 0.70, 0.12, 1.0]}
events: []
occluders: []
# Controlled sensor faults for independent validation; disabled in normal run.
faults:
  depth_hole_fraction: 0.0
  depth_unit_multiplier: 1.0
  uncalibrated_info: false
  stamp_delay_sec: 0.0
  drop_rgb_every: 0
  change_frame_after_sec: -1.0
  disable_camera_tf: false
