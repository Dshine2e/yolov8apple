/asac/topview:
  ros__parameters:
    input_mode: real
    model_path: ''
    target_classes: apple
    device: cpu
    image_size: 640
    cpu_threads: 2
    confidence: 0.20
    iou: 0.45
    max_detections: 30
    inference_rate_hz: 5.0
    rgb_only: false
    camera_id: real_top
    color_topic: /camera/camera/color/image_raw
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    expected_optical_frame: camera_color_optical_frame
    # Required for robot coordinates. Never populated from simulation config.
    base_frame: ''
    calibration_verified: false
    image_state: raw
    depth_aligned_to_rgb: true
    depth_is_optical_z: true
    depth_scale_16uc1: 0.001
    qos_reliability: best_effort
    qos_depth: 1
    sync_slop_sec: 0.03
    sync_queue_size: 5
    tf_timeout_sec: 0.08
    max_frame_age_sec: 2.0
    min_mask_pixels: 100
    hole_max_pixels: 8
    min_solidity: 0.88
    erosion_pixels: 2
    min_depth_m: 0.15
    max_depth_m: 3.0
    depth_mad_factor: 4.5
    depth_mad_floor_m: 0.008
    min_depth_points: 80
    min_depth_ratio: 0.3
    max_fit_points: 2000
    sphere_trials: 80
    sphere_inlier_threshold_m: 0.003
    sphere_min_inlier_ratio: 0.7
    sphere_max_rmse_m: 0.003
    sphere_min_radius_m: 0.015
    sphere_max_radius_m: 0.09
    sphere_max_condition: 100.0
    sphere_min_cap_fraction: 0.12
    association_max_distance_m: 0.06
    association_min_iou: 0.1
    track_ttl_sec: 2.0
    duplicate_iou: 0.85
    save_directory: ''
    save_interval_sec: 10.0
    save_max_batches: 50
